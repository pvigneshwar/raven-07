<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RAVEN-07: SHADOW STRIKE</title>
    <style>
      html, body, #game-shell {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: monospace;
        touch-action: none;
        overscroll-behavior: none;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
      #game-shell {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        width: 100dvw;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: #000;
        touch-action: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game-viewport {
        position: relative;
        width: min(100%, calc(100dvh * 16 / 9));
        height: min(100%, calc(100dvw * 9 / 16));
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
      }
      #rotate-device {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 10000;
        place-items: center;
        align-content: center;
        gap: 16px;
        color: #d9f7ff;
        background: radial-gradient(circle at center, #143447 0%, #050b10 72%);
        text-align: center;
        letter-spacing: .12em;
      }
      #rotate-device strong { font-size: 20px; color: #62e9ff; }
      #enter-landscape {
        border: 1px solid #62e9ff;
        border-radius: 4px;
        padding: 12px 18px;
        color: #e8fbff;
        background: rgba(24, 76, 96, .7);
        font: 700 14px monospace;
      }
      .mobile-portrait #rotate-device { display: grid; }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <div id="game-viewport">
        <div id="rotate-device" role="dialog" aria-label="Landscape mode required">
          <strong>ROTATE YOUR DEVICE</strong>
          <span>This game is designed for landscape mode.</span>
          <button id="enter-landscape" type="button">ENTER FULLSCREEN</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
